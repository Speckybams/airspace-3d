name: Weekly data refresh

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build:data
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh UK airspace data"
          file_pattern: public/data/uk/*
